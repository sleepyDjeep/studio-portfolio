name: Live atlas freshness

# The branch freshness job proves the repository is consistent. This one proves
# the deployed atlas is: once a day it fetches the live portfolio-data.js and
# rebuilds it from the committed docs, so a payload that never reached the site
# (broken Pages deploy, stale CDN copy) shows up as a failed run instead of
# drifting quietly.
#
# The data file is only half a deploy, so a second step fetches the page shell and
# a rotating slice of the assets the payload references: the four sound clips every
# day, and a quarter of the images and diagrams, so the whole set is covered every
# four days. Without it, a deploy serving 404s for app.js, styles.css or an image
# would stay silent while the data check passed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  live:
    name: deployed bundle matches committed docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Compare the live bundle with a clean rebuild
        env:
          LIVE_BUNDLE: https://sleepydjeep.github.io/studio-portfolio/portfolio-data.js
        run: python tools/check_bundle_freshness.py --bundle "$LIVE_BUNDLE?run=${GITHUB_RUN_ID}"

      - name: Fetch the page shell and a rotating slice of assets
        env:
          LIVE_SITE: https://sleepydjeep.github.io/studio-portfolio/
        run: python tools/check_live_shell.py --base "$LIVE_SITE"
