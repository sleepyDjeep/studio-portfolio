name: Live atlas freshness

# The branch freshness job proves the repository is consistent. This one proves
# the deployed atlas is: once a day it fetches the live portfolio-data.js and
# rebuilds it from the committed docs, so a payload that never reached the site
# (broken Pages deploy, stale CDN copy) shows up as a failed run instead of
# drifting quietly.
#
# The data file is only half a deploy, so a second step fetches the page shell and
# a rotating slice of the assets the payload references: the four sound clips every
# day, and a quarter of the images and diagrams, so the whole set is covered every
# four days. Without it, a deploy serving 404s for app.js, styles.css or an image
# would stay silent while the data check passed.

on:
  schedule:
    # 08:05 America/Chicago every day, DST-aware through the timezone key. Five
    # past the hour because GitHub names the top of the hour as a high-load time
    # when scheduled runs are delayed or dropped; dispatch runs it on demand.
    - cron: "5 8 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

# Reading the repository is all the check needs; writing issues is how a failed
# run stops being a red row nobody looks at.
permissions:
  contents: read
  issues: write

jobs:
  live:
    name: deployed bundle matches committed docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Compare the live bundle with a clean rebuild
        env:
          LIVE_BUNDLE: https://sleepydjeep.github.io/studio-portfolio/portfolio-data.js
        run: python tools/check_bundle_freshness.py --bundle "$LIVE_BUNDLE?run=${GITHUB_RUN_ID}"

      - name: Fetch the page shell and a rotating slice of assets
        env:
          LIVE_SITE: https://sleepydjeep.github.io/studio-portfolio/
        run: python tools/check_live_shell.py --base "$LIVE_SITE"

      # A red run on a cron is easy to miss, so a failure leaves a durable issue.
      # Repeated failures comment on the same open issue instead of piling up.
      - name: Open or update the issue about a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The daily live atlas check failed.\n\nRun: %s\n\nEither the deployed bundle no longer matches the committed docs, or an asset the page references is missing, mistyped or serving different bytes. Rebuild locally with `python tools/update_portfolio.py`, or read the run log for the failing path.\n' "$run_url")
          gh label create live-check --description "Daily live atlas check" --color B60205 2>/dev/null || true
          existing=$(gh issue list --label live-check --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live atlas check failed" --label live-check --body "$body"
          fi

      - name: Close the issue once the check passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label live-check --state open --json number --jq '.[].number' 2>/dev/null |
          while read -r number; do
            gh issue close "$number" --comment "The daily live check passed again."
          done
