name: Portfolio new-entry live check

# The nightly live check hashes the payload in four-day slices, so a brand-new
# entry could go unchecked for days. This job runs on every push to main, keeps
# the entry docs that push changed, waits for Pages to serve a bundle that lists
# them, then hashes their media and diagram against the committed bundle.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: entry-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entry-live:
    name: new entry is served by Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontmatter parser
        run: pip install pyyaml

      - name: Verify the pushed entries on the live site
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$HEAD_SHA^"
          fi
          python tools/check_live_push.py --base "$base" --head "$HEAD_SHA"
