<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="RTX 4060 8GB GDDR6 VRAM orchestration diagram comparing 16k context at 6.85 GB and 29.2 tok/s against 32k context WDDM spill at 8.98 GB and 3.9 tok/s, plus 5-stage sequential handoff.">
  <defs>
    <style>
    :where(:root) { color-scheme: light dark; }
    .sd-bg { fill: #f8fafc; fill: light-dark(#f8fafc, #0b0f17); }
    .sd-zone { fill: #f1f5f9; fill: light-dark(#f1f5f9, #0f1623); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .sd-card { fill: #ffffff; fill: light-dark(#ffffff, #131a26); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.5; }
    .sd-card-accent { fill: #ffffff; fill: light-dark(#ffffff, #131a26); stroke: #2563eb; stroke: light-dark(#2563eb, #3b82f6); stroke-width: 1.75; }
    .sd-card-subtle { fill: #f1f5f9; fill: light-dark(#f1f5f9, #182234); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.25; }
    .sd-card-warn { fill: #fffbeb; fill: light-dark(#fffbeb, #261405); stroke: #d97706; stroke: light-dark(#d97706, #f59e0b); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .sd-divider { stroke: #e2e8f0; stroke: light-dark(#e2e8f0, #1e293b); stroke-width: 1; }
    .sd-accent-bar { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    .sd-badge { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    .sd-badge-warn { fill: #d97706; fill: light-dark(#d97706, #f59e0b); }
    .sd-badge-ok { fill: #15803d; fill: light-dark(#15803d, #16a34a); }
    .sd-badge-text { fill: #ffffff; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sd-pill { fill: #eff6ff; fill: light-dark(#eff6ff, #172554); stroke: #bfdbfe; stroke: light-dark(#bfdbfe, #1e40af); stroke-width: 1; }
    .sd-pill-text { fill: #1d4ed8; fill: light-dark(#1d4ed8, #93c5fd); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sd-pill-neutral { fill: #f1f5f9; fill: light-dark(#f1f5f9, #1e293b); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1; }
    .sd-pill-neutral-text { fill: #334155; fill: light-dark(#334155, #cbd5e1); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sd-pill-ok { fill: #f0fdf4; fill: light-dark(#f0fdf4, #052e16); stroke: #86efac; stroke: light-dark(#86efac, #166534); stroke-width: 1; }
    .sd-pill-ok-text { fill: #166534; fill: light-dark(#166534, #86efac); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sd-pill-warn { fill: #fffbeb; fill: light-dark(#fffbeb, #451a03); stroke: #fcd34d; stroke: light-dark(#fcd34d, #92400e); stroke-width: 1; }
    .sd-pill-warn-text { fill: #92400e; fill: light-dark(#92400e, #fcd34d); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sd-hdr-title { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; }
    .sd-title { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; }
    .sd-title-sm { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
    .sd-sub { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 500; }
    .sd-sub-sm { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; }
    .sd-mono { fill: #334155; fill: light-dark(#334155, #cbd5e1); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .sd-mono-bold { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sd-zone-lbl { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
    .sd-arrow { fill: none; stroke: #2563eb; stroke: light-dark(#2563eb, #3b82f6); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .sd-arrow-dashed { fill: none; stroke: #2563eb; stroke: light-dark(#2563eb, #3b82f6); stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
    .sd-arrow-muted { fill: none; stroke: #64748b; fill: light-dark(#64748b, #94a3b8); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .sd-arrow-head { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    .sd-arrow-head-muted { fill: #64748b; fill: light-dark(#64748b, #94a3b8); }
    .sd-edge-box { fill: #f8fafc; fill: light-dark(#f8fafc, #0b0f17); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1; }
    .sd-edge-lbl { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sd-bar-track { fill: #e2e8f0; fill: light-dark(#e2e8f0, #1e293b); }
    .sd-bar-fill { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    .sd-bar-warn { fill: #d97706; fill: light-dark(#d97706, #f59e0b); }
    </style>
    <marker id="arr-local-llm-vram-orchestration" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" class="sd-arrow-head"/>
    </marker>
    <marker id="arr-m-local-llm-vram-orchestration" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" class="sd-arrow-head-muted"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="12" class="sd-bg"/>
  <rect x="20" y="20" width="4" height="20" rx="2" class="sd-accent-bar"/>
  <text x="32" y="35" class="sd-hdr-title">RTX 4060 8GB VRAM Budget &amp; 5-Stage Sequential Handoff</text>
  <rect x="673" y="17" width="267" height="25" rx="12.5" class="sd-pill"/>
  <text x="806.5" y="33.5" text-anchor="middle" class="sd-pill-text">6.85 GB @ 29.2 tok/s · Zero WDDM Spill</text>
  <line x1="20" y1="52" x2="940" y2="52" class="sd-divider"/>
  <rect x="24" y="66" width="446" height="156" rx="10" class="sd-card-accent"/>
  <rect x="36" y="78" width="25" height="22" rx="6" class="sd-badge-ok"/>
  <text x="48.5" y="92.8" text-anchor="middle" class="sd-badge-text">OK</text>
  <text x="69" y="93.5" class="sd-title">16k Context Sweet Spot (Locked Default)</text>
  <text x="36" y="113" class="sd-sub-sm">Quantized LLM + KV Cache Fits Inside Physical 8.00 GB GDDR6</text>
  <rect x="36" y="190" width="422" height="22" rx="11.0" class="sd-pill-ok"/>
  <text x="247.0" y="204.8" text-anchor="middle" class="sd-pill-ok-text">6.85 GB VRAM · 29.2 tok/s · 1.15 GB Headroom</text>
  <rect x="38" y="146" width="418" height="14" rx="7.0" class="sd-bar-track"/>
  <rect x="38" y="146" width="357.9" height="14" rx="7.0" class="sd-bar-fill"/>
  <text x="38" y="176" class="sd-mono">GDDR6 Usage: 6.85 / 8.00 GB (85.6%)</text>
  <rect x="490" y="66" width="446" height="156" rx="10" class="sd-card-warn"/>
  <rect x="502" y="78" width="25" height="22" rx="6" class="sd-badge-warn"/>
  <text x="514.5" y="92.8" text-anchor="middle" class="sd-badge-text">!!</text>
  <text x="535" y="93.5" class="sd-title">32k Context WDDM Spill (Blocked Trap)</text>
  <text x="502" y="113" class="sd-sub-sm">KV Cache Overflows 8 GB -&gt; Pages Across PCIe to System RAM</text>
  <rect x="502" y="190" width="422" height="22" rx="11.0" class="sd-pill-warn"/>
  <text x="713.0" y="204.8" text-anchor="middle" class="sd-pill-warn-text">8.98 GB Total · 3.9 tok/s (-86.6% Collapse)</text>
  <rect x="504" y="146" width="418" height="14" rx="7.0" class="sd-bar-track"/>
  <rect x="504" y="146" width="359.5" height="14" rx="7.0" class="sd-bar-fill"/>
  <rect x="861.5" y="146" width="60.5" height="14" rx="7.0" class="sd-bar-warn"/>
  <text x="504" y="176" class="sd-mono">8.00 GB GDDR6 + 0.98 GB Shared WDDM Spill</text>
  <rect x="20" y="240" width="920" height="182" rx="12" class="sd-zone"/>
  <text x="34" y="259" class="sd-zone-lbl">5-STAGE SEQUENTIAL GPU HANDOFF PIPELINE (SINGLE-TENANT VRAM DISCIPLINE)</text>
