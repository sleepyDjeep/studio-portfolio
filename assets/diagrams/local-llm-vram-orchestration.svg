  <rect x="46" y="282" width="25" height="20" rx="5" class="sd-badge"/>
  <text x="58.5" y="295.8" text-anchor="middle" class="sd-badge-text">01</text>
  <text x="77" y="296" class="sd-mono">Spec &amp; Code</text>
  <text x="46" y="319" class="sd-title">LM Studio 16k</text>
  <rect x="46" y="376" width="136" height="22" rx="11.0" class="sd-pill"/>
  <text x="114.0" y="390.8" text-anchor="middle" class="sd-pill-text">6.85 GB Peak</text>
  <rect x="214" y="270" width="160" height="138" rx="10" class="sd-card"/>
  <rect x="226" y="282" width="25" height="20" rx="5" class="sd-badge"/>
  <text x="238.5" y="295.8" text-anchor="middle" class="sd-badge-text">02</text>
  <text x="257" y="296" class="sd-mono">lms unload</text>
  <text x="226" y="319" class="sd-title">LLM Unload</text>
  <rect x="226" y="376" width="136" height="22" rx="11.0" class="sd-pill-neutral"/>
  <text x="294.0" y="390.8" text-anchor="middle" class="sd-pill-neutral-text">-&gt; 0.4 GB Idle</text>
  <rect x="394" y="270" width="160" height="138" rx="10" class="sd-card"/>
  <rect x="406" y="282" width="25" height="20" rx="5" class="sd-badge"/>
  <text x="418.5" y="295.8" text-anchor="middle" class="sd-badge-text">03</text>
  <text x="437" y="296" class="sd-mono">Gen + Flush</text>
  <text x="406" y="319" class="sd-title">ComfyUI /free</text>
  <rect x="406" y="376" width="136" height="22" rx="11.0" class="sd-pill"/>
  <text x="474.0" y="390.8" text-anchor="middle" class="sd-pill-text">POST /free</text>
  <rect x="574" y="270" width="160" height="138" rx="10" class="sd-card"/>
  <rect x="586" y="282" width="25" height="20" rx="5" class="sd-badge"/>
  <text x="598.5" y="295.8" text-anchor="middle" class="sd-badge-text">04</text>
  <text x="617" y="296" class="sd-mono">Cycles Bake</text>
  <text x="586" y="319" class="sd-title">Blender 5.1</text>
  <rect x="586" y="376" width="136" height="22" rx="11.0" class="sd-pill"/>
  <text x="654.0" y="390.8" text-anchor="middle" class="sd-pill-text">CUDA / OptiX</text>
  <rect x="754" y="270" width="160" height="138" rx="10" class="sd-card-accent"/>
  <rect x="766" y="282" width="25" height="20" rx="5" class="sd-badge-ok"/>
  <text x="778.5" y="295.8" text-anchor="middle" class="sd-badge-text">05</text>
  <text x="797" y="296" class="sd-mono">Vulkan QA</text>
  <text x="766" y="319" class="sd-title">Godot 4.7</text>
  <rect x="766" y="376" width="136" height="22" rx="11.0" class="sd-pill-ok"/>
  <text x="834.0" y="390.8" text-anchor="middle" class="sd-pill-ok-text">60 FPS Clean</text>
