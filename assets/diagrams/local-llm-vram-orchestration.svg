  <path d="M 374.0 339.0 L 392.0 339.0" class="sd-arrow" marker-end="url(#arr-local-llm-vram-orchestration)"/>
  <path d="M 554.0 339.0 L 572.0 339.0" class="sd-arrow" marker-end="url(#arr-local-llm-vram-orchestration)"/>
  <path d="M 734.0 339.0 L 752.0 339.0" class="sd-arrow" marker-end="url(#arr-local-llm-vram-orchestration)"/>
