<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Thirty-hen automatic feeder architecture: a 50 litre hopper on four load cells feeds a 25 mm spring auger driven by a 12 V worm motor into a 1.4 metre ring trough, controlled by an ESP32-C3 with HX711 weighing and INA219 current sensing, powered by two hot-swappable 18650 cells through an LM66200 ideal-diode OR with a third cell rotating on a bench charger.">
  <defs>
    <style>
    :where(:root) { color-scheme: light dark; }
    .sd-bg { fill: #f8fafc; fill: light-dark(#f8fafc, #0b0f17); }
    .sd-zone { fill: #f1f5f9; fill: light-dark(#f1f5f9, #0f1623); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .sd-card { fill: #ffffff; fill: light-dark(#ffffff, #131a26); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.5; }
    .sd-card-accent { fill: #ffffff; fill: light-dark(#ffffff, #131a26); stroke: #2563eb; stroke: light-dark(#2563eb, #3b82f6); stroke-width: 1.75; }
    .sd-card-subtle { fill: #f1f5f9; fill: light-dark(#f1f5f9, #182234); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.25; }
    .sd-divider { stroke: #e2e8f0; stroke: light-dark(#e2e8f0, #1e293b); stroke-width: 1; }
    .sd-accent-bar { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    .sd-pill { fill: #eff6ff; fill: light-dark(#eff6ff, #172554); stroke: #bfdbfe; stroke: light-dark(#bfdbfe, #1e40af); stroke-width: 1; }
    .sd-pill-text { fill: #1d4ed8; fill: light-dark(#1d4ed8, #93c5fd); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sd-pill-ok { fill: #f0fdf4; fill: light-dark(#f0fdf4, #052e16); stroke: #86efac; stroke: light-dark(#86efac, #166534); stroke-width: 1; }
    .sd-pill-ok-text { fill: #166534; fill: light-dark(#166534, #86efac); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sd-hdr-title { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; }
    .sd-title { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; }
    .sd-title-sm { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
    .sd-sub { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 500; }
    .sd-sub-sm { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; }
    .sd-mono { fill: #334155; fill: light-dark(#334155, #cbd5e1); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .sd-zone-lbl { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
    .sd-arrow { fill: none; stroke: #2563eb; stroke: light-dark(#2563eb, #3b82f6); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .sd-arrow-head { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    </style>
    <marker id="arr-feed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" class="sd-arrow-head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="12" class="sd-bg"/>
  <rect x="20" y="20" width="4" height="20" rx="2" class="sd-accent-bar"/>
  <text x="32" y="35" class="sd-hdr-title">30-Hen Automatic Feeder — Feed by Mass, Swap One Cell a Week</text>
  <rect x="700" y="17" width="240" height="25" rx="12.5" class="sd-pill"/>
  <text x="820" y="33.5" text-anchor="middle" class="sd-pill-text">30 hens · 3.6 kg/day · 4 × 900 g</text>
  <line x1="20" y1="52" x2="940" y2="52" class="sd-divider"/>

  <rect x="24" y="70" width="184" height="238" rx="10" class="sd-zone"/>
  <text x="36" y="90" class="sd-zone-lbl">HOPPER</text>
  <rect x="34" y="98" width="164" height="66" rx="8" class="sd-card-accent"/>
  <text x="46" y="119" class="sd-title-sm">50 L · 32 kg</text>
  <text x="46" y="136" class="sd-sub-sm">480 × 480 mm footprint</text>
  <text x="46" y="152" class="sd-mono">lid 1.30 m · one sack/week</text>
  <rect x="34" y="174" width="164" height="56" rx="8" class="sd-card"/>
  <text x="46" y="195" class="sd-title-sm">55–60° Cone</text>
  <text x="46" y="212" class="sd-sub-sm">70 mm outlet</text>
  <text x="46" y="225" class="sd-mono">paddle breaks arches</text>
  <rect x="34" y="238" width="164" height="56" rx="8" class="sd-card-subtle"/>
  <text x="46" y="259" class="sd-title-sm">4 × 50 kg Cells</text>
  <text x="46" y="276" class="sd-sub-sm">hopper on its own sub-frame</text>
  <text x="46" y="289" class="sd-mono">200 kg range · HX711</text>

  <line x1="212" y1="188" x2="234" y2="188" class="sd-arrow" marker-end="url(#arr-feed)"/>

  <rect x="238" y="70" width="196" height="238" rx="10" class="sd-zone"/>
  <text x="250" y="90" class="sd-zone-lbl">AUGER</text>
  <rect x="248" y="98" width="176" height="66" rx="8" class="sd-card-accent"/>
  <text x="260" y="119" class="sd-title-sm">25 mm Spring</text>
  <text x="260" y="136" class="sd-sub-sm">900 mm in 32 mm PVC</text>
  <text x="260" y="152" class="sd-mono">split tube for clearing</text>
  <rect x="248" y="174" width="176" height="56" rx="8" class="sd-card"/>
  <text x="260" y="195" class="sd-title-sm">30° Uphill</text>
  <text x="260" y="212" class="sd-sub-sm">0.95 m → 1.35 m</text>
  <text x="260" y="225" class="sd-mono">200–320 g/min</text>
  <rect x="248" y="238" width="176" height="56" rx="8" class="sd-card-subtle"/>
  <text x="260" y="259" class="sd-title-sm">12 V Worm · 80 rpm</text>
  <text x="260" y="276" class="sd-sub-sm">0.5 Nm vs 0.15 Nm load</text>
  <text x="260" y="289" class="sd-mono">8 mm jaw coupling</text>

  <line x1="438" y1="188" x2="460" y2="188" class="sd-arrow" marker-end="url(#arr-feed)"/>

  <rect x="464" y="70" width="196" height="238" rx="10" class="sd-zone"/>
  <text x="476" y="90" class="sd-zone-lbl">TROUGH</text>
  <rect x="474" y="98" width="176" height="66" rx="8" class="sd-card-accent"/>
  <text x="486" y="119" class="sd-title-sm">1.4 m Ring</text>
  <text x="486" y="136" class="sd-sub-sm">3.77 m edge · 150 mm wide</text>
  <text x="486" y="152" class="sd-mono">12.6 cm per hen</text>
  <rect x="474" y="174" width="176" height="56" rx="8" class="sd-card"/>
  <text x="486" y="195" class="sd-title-sm">Cone + 4 Vanes</text>
  <text x="486" y="212" class="sd-sub-sm">900 g ≈ 4 mm ribbon</text>
  <text x="486" y="225" class="sd-mono">floor at 300 mm</text>
  <rect x="474" y="238" width="176" height="56" rx="8" class="sd-card-subtle"/>
  <text x="486" y="259" class="sd-title-sm">Rain Hood</text>
  <text x="486" y="276" class="sd-sub-sm">1.6 m polycarbonate</text>
  <text x="486" y="289" class="sd-mono">100 mm slot · 6 drains</text>

  <line x1="664" y1="188" x2="686" y2="188" class="sd-arrow" marker-end="url(#arr-feed)"/>

  <rect x="690" y="70" width="246" height="238" rx="10" class="sd-zone"/>
  <text x="702" y="90" class="sd-zone-lbl">POWER + CONTROL</text>
  <rect x="700" y="98" width="226" height="66" rx="8" class="sd-card-accent"/>
  <text x="712" y="119" class="sd-title-sm">ESP32-C3</text>
  <text x="712" y="136" class="sd-sub-sm">deep sleep · sunrise/sunset schedule</text>
  <text x="712" y="152" class="sd-mono">HX711 mass · INA219 current</text>
  <rect x="700" y="174" width="108" height="56" rx="8" class="sd-card"/>
  <text x="710" y="195" class="sd-title-sm">LM66200</text>
  <text x="710" y="212" class="sd-sub-sm">dual ideal diode</text>
  <text x="710" y="225" class="sd-mono">no cross-charge</text>
  <rect x="818" y="174" width="108" height="56" rx="8" class="sd-card"/>
  <text x="828" y="195" class="sd-title-sm">TPS63802</text>
  <text x="828" y="212" class="sd-sub-sm">3.3 V buck-boost</text>
  <text x="828" y="225" class="sd-mono">down to 2.5 V in</text>
  <rect x="700" y="238" width="108" height="56" rx="8" class="sd-card-subtle"/>
  <text x="710" y="259" class="sd-title-sm">12 V Boost</text>
  <text x="710" y="276" class="sd-sub-sm">EN between meals</text>
  <text x="710" y="289" class="sd-mono">TPS61088</text>
  <rect x="818" y="238" width="108" height="56" rx="8" class="sd-card-subtle"/>
  <text x="828" y="259" class="sd-title-sm">DRV8871</text>
  <text x="828" y="276" class="sd-sub-sm">3 A limit · reverse jog</text>
  <text x="828" y="289" class="sd-mono">~1 A running</text>

  <line x1="20" y1="322" x2="940" y2="322" class="sd-divider"/>
  <text x="24" y="342" class="sd-zone-lbl">THREE-CELL ROTATION — PULL EITHER CELL AT ANY TIME</text>
  <rect x="24" y="350" width="216" height="48" rx="8" class="sd-card"/>
  <text x="36" y="368" class="sd-title-sm">Week 1 · pull A</text>
  <text x="36" y="384" class="sd-mono">B runs · C charged into A</text>
  <rect x="252" y="350" width="216" height="48" rx="8" class="sd-card"/>
  <text x="264" y="368" class="sd-title-sm">Week 2 · pull B</text>
  <text x="264" y="384" class="sd-mono">A runs · charged C into B</text>
  <rect x="480" y="350" width="216" height="48" rx="8" class="sd-card"/>
  <text x="492" y="368" class="sd-title-sm">Never in parallel</text>
  <text x="492" y="384" class="sd-mono">OR blocks reverse current</text>
  <rect x="708" y="350" width="228" height="48" rx="8" class="sd-card"/>
  <text x="720" y="368" class="sd-title-sm">~370 mAh/day · 16 days</text>
  <text x="720" y="384" class="sd-mono">charge only on a bench charger</text>

  <text x="24" y="420" class="sd-mono">~EUR 220 BOM · 4 weighed meals/day · jam: stop, reverse 1 s, retry 3, alarm</text>
  <rect x="796" y="404" width="140" height="22" rx="11" class="sd-pill-ok"/>
  <text x="866" y="419" text-anchor="middle" class="sd-pill-ok-text">Firmware compiles</text>
</svg>
