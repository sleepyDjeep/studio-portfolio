<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="nb-title nb-desc">
  <title id="nb-title">Nano Banana Multi-Shot Concept-Art &amp; Hardware Variant Factory</title>
  <desc id="nb-desc">Deterministic architecture showing JSON prompt matrices feeding paced Nano Banana image-generator shards, compiled by run_concept_workflow.py into Markdown triads, zero-server HTML atlases, and Studio Portfolio galleries.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f8fafc, #0b0f17);
      --card: light-dark(#ffffff, #131a26);
      --card-alt: light-dark(#f1f5f9, #182232);
      --ink: light-dark(#0f172a, #f8fafc);
      --muted: light-dark(#475569, #94a3b8);
      --border: light-dark(#cbd5e1, #26334d);
      --accent: light-dark(#2563eb, #3b82f6);
      --accent-soft: light-dark(#dbeafe, #172554);
      --ok: light-dark(#059669, #10b981);
      --ok-soft: light-dark(#d1fae5, #064e3b);
      --amber: light-dark(#b45309, #f59e0b);
      --amber-soft: light-dark(#fef3c7, #451a03);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    .bg { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .box { fill: var(--card); stroke: var(--border); stroke-width: 1.5; rx: 10; }
    .box-accent { fill: var(--card); stroke: var(--accent); stroke-width: 2; rx: 10; }
    .pill-blue { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; rx: 6; }
    .pill-green { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1; rx: 6; }
    .pill-amber { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1; rx: 6; }
    .h1 { fill: var(--ink); font-size: 16px; font-weight: 700; }
    .h2 { fill: var(--ink); font-size: 13px; font-weight: 700; }
    .body { fill: var(--muted); font-size: 11px; }
    .mono { fill: var(--ink); font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .tag { fill: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
    .tag-ok { fill: var(--ok); font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
    .tag-amber { fill: var(--amber); font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
    .arrow { stroke: var(--accent); stroke-width: 1.75; fill: none; marker-end: url(#arrow-head); }
    .arrow-muted { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow-head-muted); }
  </style>
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--accent)" />
    </marker>
    <marker id="arrow-head-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--muted)" />
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="424" rx="14" class="bg" />

  <!-- Header -->
  <text x="32" y="40" class="h1">Nano Banana Concept-Art &amp; Hardware Variant Factory</text>
  <text x="32" y="59" class="body">0 MB Local VRAM  |  16:9 1376x768 Renders  |  Deterministic Prefix Matching &amp; Dual-Surface Publishing</text>
  <rect x="748" y="24" width="180" height="28" class="pill-green" />
  <text x="762" y="42" class="tag-ok">51 / 51 RENDERS VERIFIED</text>

  <!-- Stage 1: JSON Matrices -->
  <rect x="28" y="84" width="205" height="318" class="box" />
  <rect x="42" y="98" width="118" height="20" class="pill-blue" />
  <text x="50" y="112" class="tag">1. PROMPT MATRICES</text>
  <text x="42" y="138" class="h2">Structured JSON Specs</text>
  <text x="42" y="156" class="body">Versioned under _Shared_Library</text>

  <rect x="42" y="172" width="177" height="96" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="52" y="191" class="mono">story_worlds_45.json</text>
  <text x="52" y="209" class="body">15 Worlds x 3-Shot Pitch Triad:</text>
  <text x="52" y="225" class="body">• 01_establishing (Architecture)</text>
  <text x="52" y="240" class="body">• 02_character (Cast &amp; Factions)</text>
  <text x="52" y="255" class="body">• 03_gameplay (Diegetic Action)</text>

  <rect x="42" y="280" width="177" height="106" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="52" y="299" class="mono">hardware_demos_6.json</text>
  <text x="52" y="317" class="body">• 3x Orange Pi E-Dab Demos</text>
  <text x="52" y="332" class="body">  (Walnut / Cutaway / Lineup)</text>
  <text x="52" y="350" class="body">• 3x S21U Cyberdeck Configs</text>
  <text x="52" y="365" class="body">  (HOSAS / KVM Lab / Slate)</text>

  <!-- Stage 2: Paced Shards -->
  <rect x="265" y="84" width="215" height="318" class="box-accent" />
  <rect x="279" y="98" width="144" height="20" class="pill-amber" />
  <text x="287" y="112" class="tag-amber">2. PACED CLOUD SHARDS</text>
  <text x="279" y="138" class="h2">Nano Banana Subagents</text>
  <text x="279" y="156" class="body">gemini-3.1-flash-image (Cloud)</text>

  <rect x="279" y="172" width="187" height="68" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="289" y="191" class="h2">Concurrency Guardrail</text>
  <text x="289" y="208" class="body">&lt;= 3–4 active shards (3–6 imgs)</text>
  <text x="289" y="224" class="body">Prevents HTTP 429 burst spikes</text>

  <rect x="279" y="252" width="187" height="64" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="289" y="271" class="h2">Era-Matched Art Direction</text>
  <text x="289" y="288" class="body">Piranesi, Deco Noir, Moebius,</text>
  <text x="289" y="304" class="body">Ukiyo-e, CAD Cutaway, Studio</text>

  <rect x="279" y="328" width="187" height="58" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="289" y="346" class="mono">&lt;prefix&gt;_&lt;ts&gt;.jpg</text>
  <text x="289" y="363" class="body">Zero fake UI text / zero VRAM</text>

  <!-- Stage 3: Compiler -->
  <rect x="512" y="84" width="190" height="318" class="box" />
  <rect x="526" y="98" width="136" height="20" class="pill-blue" />
  <text x="534" y="112" class="tag">3. PYTHON COMPILER</text>
  <text x="526" y="138" class="mono">run_concept_workflow.py</text>
  <text x="526" y="156" class="body">Idempotent status &amp; distributor</text>

  <rect x="526" y="172" width="162" height="62" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="536" y="191" class="mono">--status-only</text>
  <text x="536" y="208" class="body">Audits 51 prefixes &amp; lists</text>
  <text x="536" y="223" class="body">any missing slots cleanly</text>

  <rect x="526" y="246" width="162" height="66" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="536" y="265" class="h2">Pillow PNG Optimizer</text>
  <text x="536" y="282" class="body">Normalizes 1376x768 RGB</text>
  <text x="536" y="297" class="body">PNGs across 5 target roots</text>

  <rect x="526" y="324" width="162" height="62" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="536" y="343" class="h2">Idempotent Injector</text>
  <text x="536" y="360" class="body">Rebuilds MD tables &amp; HTML</text>
  <text x="536" y="375" class="body">atlas without duplicates</text>

  <!-- Stage 4: Dual-Surface Outputs -->
  <rect x="734" y="84" width="198" height="318" class="box" />
  <rect x="748" y="98" width="142" height="20" class="pill-green" />
  <text x="756" y="112" class="tag-ok">4. LIVE DELIVERABLES</text>

  <rect x="748" y="130" width="170" height="76" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="758" y="149" class="h2">Markdown Lore Bible</text>
  <text x="758" y="166" class="mono">public_domain_mashup</text>
  <text x="758" y="180" class="mono">_worlds.md</text>
  <text x="758" y="196" class="body">15 inline 3-shot pitch tables</text>

  <rect x="748" y="218" width="170" height="78" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="758" y="237" class="h2">Standalone HTML Atlas</text>
  <text x="758" y="254" class="mono">story_worlds_atlas.html</text>
  <text x="758" y="271" class="body">file:// filter, dark mode, &amp;</text>
  <text x="758" y="286" class="body">native &lt;dialog&gt; lightbox</text>

  <rect x="748" y="308" width="170" height="78" rx="8" fill="var(--card-alt)" stroke="var(--border)" />
  <text x="758" y="327" class="h2">Studio Portfolio &amp; CAD</text>
  <text x="758" y="344" class="body">• 45 Story World gallery imgs</text>
  <text x="758" y="359" class="body">• 3 E-Rig renders (+ repo dir)</text>
  <text x="758" y="374" class="body">• 3 S21U I/O layout configs</text>

  <!-- Connectors -->
  <line x1="233" y1="243" x2="263" y2="243" class="arrow" />
  <line x1="480" y1="243" x2="510" y2="243" class="arrow" />
  <path d="M 702 200 L 718 200 L 718 168 L 732 168" class="arrow" />
  <line x1="702" y1="257" x2="732" y2="257" class="arrow" />
  <path d="M 702 314 L 718 314 L 718 347 L 732 347" class="arrow" />
  <path d="M 593 172 L 593 74 L 372 74 L 372 82" class="arrow-muted" />
</svg>
