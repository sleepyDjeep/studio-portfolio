<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="CellStation Arbor power and detection architecture: eight charge wells feed bidirectional LM51770 buck-boost stages with four-wire Kelvin contacts, INA228 telemetry and MCP4728 setpoints, supervised by an ESP32-S3 and an independent analogue window comparator, with a six-step detection sequence running from open-circuit band through I-V sweep, DCIR, plateau, relaxation tail and a 5 V handshake.">
  <defs>
    <style>
    :where(:root) { color-scheme: light dark; }
    .sd-bg { fill: #f8fafc; fill: light-dark(#f8fafc, #0b0f17); }
    .sd-zone { fill: #f1f5f9; fill: light-dark(#f1f5f9, #0f1623); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .sd-card { fill: #ffffff; fill: light-dark(#ffffff, #131a26); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.5; }
    .sd-card-accent { fill: #ffffff; fill: light-dark(#ffffff, #131a26); stroke: #2563eb; stroke: light-dark(#2563eb, #3b82f6); stroke-width: 1.75; }
    .sd-card-subtle { fill: #f1f5f9; fill: light-dark(#f1f5f9, #182234); stroke: #cbd5e1; stroke: light-dark(#cbd5e1, #334155); stroke-width: 1.25; }
    .sd-divider { stroke: #e2e8f0; stroke: light-dark(#e2e8f0, #1e293b); stroke-width: 1; }
    .sd-accent-bar { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    .sd-pill { fill: #eff6ff; fill: light-dark(#eff6ff, #172554); stroke: #bfdbfe; stroke: light-dark(#bfdbfe, #1e40af); stroke-width: 1; }
    .sd-pill-text { fill: #1d4ed8; fill: light-dark(#1d4ed8, #93c5fd); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sd-pill-ok { fill: #f0fdf4; fill: light-dark(#f0fdf4, #052e16); stroke: #86efac; stroke: light-dark(#86efac, #166534); stroke-width: 1; }
    .sd-pill-ok-text { fill: #166534; fill: light-dark(#166534, #86efac); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sd-hdr-title { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; }
    .sd-title { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; }
    .sd-title-sm { fill: #0f172a; fill: light-dark(#0f172a, #f8fafc); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
    .sd-sub { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 500; }
    .sd-sub-sm { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; }
    .sd-mono { fill: #334155; fill: light-dark(#334155, #cbd5e1); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .sd-zone-lbl { fill: #475569; fill: light-dark(#475569, #94a3b8); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
    .sd-arrow { fill: none; stroke: #2563eb; stroke: light-dark(#2563eb, #3b82f6); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .sd-arrow-head { fill: #2563eb; fill: light-dark(#2563eb, #3b82f6); }
    </style>
    <marker id="arr-slot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" class="sd-arrow-head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="12" class="sd-bg"/>
  <rect x="20" y="20" width="4" height="20" rx="2" class="sd-accent-bar"/>
  <text x="32" y="35" class="sd-hdr-title">CellStation Arbor — 8-Bay Auto-Detecting Battery Station</text>
  <rect x="690" y="17" width="250" height="25" rx="12.5" class="sd-pill"/>
  <text x="815" y="33.5" text-anchor="middle" class="sd-pill-text">8 Bays · 5 Chemistries · $214.53</text>
  <line x1="20" y1="52" x2="940" y2="52" class="sd-divider"/>

  <rect x="24" y="70" width="178" height="238" rx="10" class="sd-zone"/>
  <text x="36" y="90" class="sd-zone-lbl">CHARGE DECK</text>
  <rect x="34" y="98" width="158" height="66" rx="8" class="sd-card-accent"/>
  <text x="46" y="119" class="sd-title-sm">8 Wells · 2 × 4</text>
  <text x="46" y="136" class="sd-sub-sm">62 × 18 × 14 mm</text>
  <text x="46" y="152" class="sd-mono">68 mm pitch · glass lid</text>
  <rect x="34" y="174" width="158" height="56" rx="8" class="sd-card"/>
  <text x="46" y="195" class="sd-title-sm">24-Cell Drawer</text>
  <text x="46" y="212" class="sd-sub-sm">22 mm pitch · rear pull</text>
  <text x="46" y="225" class="sd-mono">AA · AAA · 14500 · 18650</text>
  <rect x="34" y="238" width="158" height="56" rx="8" class="sd-card-subtle"/>
  <text x="46" y="259" class="sd-title-sm">300 × 180 × 150</text>
  <text x="46" y="276" class="sd-sub-sm">plinth 14 · deck at 112</text>
  <text x="46" y="289" class="sd-mono">40 mm rear exhaust fan</text>

  <line x1="206" y1="188" x2="228" y2="188" class="sd-arrow" marker-end="url(#arr-slot)"/>

  <rect x="232" y="70" width="330" height="238" rx="10" class="sd-zone"/>
  <text x="244" y="90" class="sd-zone-lbl">PER-SLOT CHANNEL × 8</text>
  <rect x="242" y="98" width="310" height="60" rx="8" class="sd-card-accent"/>
  <text x="254" y="119" class="sd-title-sm">LM51770 4-Switch Buck-Boost</text>
  <text x="254" y="136" class="sd-sub-sm">bidirectional · 0.9 V to 5.5 V at the cell</text>
  <text x="254" y="150" class="sd-mono">same bay for 1.2 V NiMH and 5 V buck cells</text>
  <rect x="242" y="166" width="150" height="64" rx="8" class="sd-card"/>
  <text x="254" y="187" class="sd-title-sm">4-Wire Kelvin</text>
  <text x="254" y="204" class="sd-sub-sm">pogo contacts</text>
  <text x="254" y="220" class="sd-mono">IR out of the reading</text>
  <rect x="402" y="166" width="150" height="64" rx="8" class="sd-card"/>
  <text x="414" y="187" class="sd-title-sm">4PDT Polarity</text>
  <text x="414" y="204" class="sd-sub-sm">relay flips the pair</text>
  <text x="414" y="220" class="sd-mono">NTC against cell</text>
  <rect x="242" y="238" width="150" height="56" rx="8" class="sd-card-subtle"/>
  <text x="254" y="259" class="sd-title-sm">INA228</text>
  <text x="254" y="276" class="sd-sub-sm">20-bit V / I telemetry</text>
  <text x="254" y="289" class="sd-mono">coulomb counting</text>
  <rect x="402" y="238" width="150" height="56" rx="8" class="sd-card-subtle"/>
  <text x="414" y="259" class="sd-title-sm">MCP4728</text>
  <text x="414" y="276" class="sd-sub-sm">per-slot setpoint DAC</text>
  <text x="414" y="289" class="sd-mono">V and I target</text>

  <line x1="566" y1="188" x2="588" y2="188" class="sd-arrow" marker-end="url(#arr-slot)"/>

  <rect x="592" y="70" width="186" height="238" rx="10" class="sd-zone"/>
  <text x="604" y="90" class="sd-zone-lbl">SUPERVISOR</text>
  <rect x="602" y="98" width="166" height="66" rx="8" class="sd-card-accent"/>
  <text x="614" y="119" class="sd-title-sm">ESP32-S3</text>
  <text x="614" y="136" class="sd-sub-sm">profiles · timers · display</text>
  <text x="614" y="152" class="sd-mono">Wi-Fi status endpoint</text>
  <rect x="602" y="174" width="166" height="56" rx="8" class="sd-card"/>
  <text x="614" y="195" class="sd-title-sm">Window Comparator</text>
  <text x="614" y="212" class="sd-sub-sm">analogue, independent</text>
  <text x="614" y="225" class="sd-mono">clamps without firmware</text>
  <rect x="602" y="238" width="166" height="56" rx="8" class="sd-card-subtle"/>
  <text x="614" y="259" class="sd-title-sm">Two-Layer Cutoff</text>
  <text x="614" y="276" class="sd-sub-sm">comparator + supervisor</text>
  <text x="614" y="289" class="sd-mono">ref tracks chemistry</text>

  <line x1="782" y1="188" x2="804" y2="188" class="sd-arrow" marker-end="url(#arr-slot)"/>

  <rect x="808" y="70" width="128" height="238" rx="10" class="sd-zone"/>
  <text x="820" y="90" class="sd-zone-lbl">HARD LIMITS</text>
  <rect x="818" y="98" width="108" height="38" rx="6" class="sd-card"/>
  <text x="826" y="114" class="sd-mono">unknown</text>
  <text x="918" y="114" text-anchor="end" class="sd-mono">1.80 V</text>
  <text x="826" y="129" class="sd-mono">NiMH</text>
  <text x="918" y="129" text-anchor="end" class="sd-mono">1.75 V</text>
  <rect x="818" y="140" width="108" height="38" rx="6" class="sd-card-subtle"/>
  <text x="826" y="156" class="sd-mono">LiFePO4</text>
  <text x="918" y="156" text-anchor="end" class="sd-mono">3.70 V</text>
  <text x="826" y="171" class="sd-mono">Li-ion</text>
  <text x="918" y="171" text-anchor="end" class="sd-mono">4.30 V</text>
  <rect x="818" y="182" width="108" height="38" rx="6" class="sd-card"/>
  <text x="826" y="198" class="sd-mono">1.5 V Li</text>
  <text x="918" y="198" text-anchor="end" class="sd-mono">5.55 V</text>
  <text x="826" y="213" class="sd-sub-sm">buck cells</text>
  <text x="818" y="238" class="sd-sub-sm">Absolute max,</text>
  <text x="818" y="252" class="sd-sub-sm">not profile</text>
  <text x="818" y="266" class="sd-sub-sm">ceiling.</text>
  <text x="818" y="288" class="sd-mono">50/50 audit</text>

  <line x1="20" y1="322" x2="940" y2="322" class="sd-divider"/>
  <text x="24" y="342" class="sd-zone-lbl">DETECTION SEQUENCE — NO CURRENT UNTIL THE CELL IS IDENTIFIED</text>
  <rect x="24" y="350" width="144" height="48" rx="8" class="sd-card"/>
  <text x="34" y="368" class="sd-title-sm">1 · OCV band</text>
  <text x="34" y="383" class="sd-mono">1.5 / 3.6 / 4.2 V</text>
  <rect x="176" y="350" width="144" height="48" rx="8" class="sd-card"/>
  <text x="186" y="368" class="sd-title-sm">2 · I-V sweep</text>
  <text x="186" y="383" class="sd-mono">40 mA · 43 steps</text>
  <rect x="328" y="350" width="144" height="48" rx="8" class="sd-card"/>
  <text x="338" y="368" class="sd-title-sm">3 · DCIR pulse</text>
  <text x="338" y="383" class="sd-mono">50 / 400 mA</text>
  <rect x="480" y="350" width="144" height="48" rx="8" class="sd-card"/>
  <text x="490" y="368" class="sd-title-sm">4 · Plateau</text>
  <text x="490" y="383" class="sd-mono">full alkaline gate</text>
  <rect x="632" y="350" width="144" height="48" rx="8" class="sd-card"/>
  <text x="642" y="368" class="sd-title-sm">5 · Relaxation</text>
  <text x="642" y="383" class="sd-mono">2.6–3.55 V tail</text>
  <rect x="784" y="350" width="152" height="48" rx="8" class="sd-card"/>
  <text x="794" y="368" class="sd-title-sm">6 · 5 V handshake</text>
  <text x="794" y="383" class="sd-mono">60 mA · 150 ms</text>

  <text x="24" y="420" class="sd-mono">14 cell archetypes · 50 interviews · 0 misclassified · 0 unsafe · $214.53 4-slot BOM</text>
  <rect x="820" y="404" width="116" height="22" rx="11" class="sd-pill-ok"/>
  <text x="878" y="419" text-anchor="middle" class="sd-pill-ok-text">Simulation audited</text>
</svg>
