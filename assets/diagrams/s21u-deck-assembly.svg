  <text class="m" x="140" y="442">90 × 80 × 3 mm subfloor plate over the raised pan and its centre seam</text>
  <text class="m" x="140" y="458">neoprene gasket on the lid rim — bare steel is not IP65</text>

  <!-- width dimension -->
  <line class="dim" x1="90" y1="492" x2="90" y2="514"/>
  <line class="dim" x1="699.6" y1="492" x2="699.6" y2="514"/>
  <line class="dim" x1="90" y1="508" x2="699.6" y2="508"/>
  <path class="dim" d="M 90 508 l 8 -4 v 8 z" fill="#64748b"/>
  <path class="dim" d="M 699.6 508 l -8 -4 v 8 z" fill="#64748b"/>
