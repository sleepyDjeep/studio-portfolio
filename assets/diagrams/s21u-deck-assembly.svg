<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-label="S21U-DECK MK.I Rev B assembly sheet audited against a photo of the actual 20 by 9 by 9 inch Craftsman steel box: ribbed body, twin draw latches with a centre padlock hasp, riveted piano hinge and lift-out tray. Side cross-section of the 60 to 85 mm lid holding the 10.1 inch panel over a 132 to 157 mm tub behind a 488 by 208 mm deck plate; top view of the deck with 60 percent keyboard, trackpad, two stick wells and twin 100 by 50 mm patch plates flanking the hasp; cut list, assembly sequence and a list of what the photo changed.">
