      .t { fill: #0f172a; font-family: Inter, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
      .b { fill: #475569; font-family: Inter, 'Segoe UI', sans-serif; font-size: 10.5px; }
      .m { fill: #334155; font-family: ui-monospace, Consolas, monospace; font-size: 10px; }
      .sm { fill: #334155; font-family: ui-monospace, Consolas, monospace; font-size: 9px; font-weight: 700; }
