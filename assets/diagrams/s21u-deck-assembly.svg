  <rect class="bg" x="0" y="0" width="1600" height="1080"/>
  <rect x="24" y="24" width="6" height="26" rx="3" fill="#2563eb"/>
  <text class="h1" x="42" y="45">S21U-DECK MK.I — Assembly &amp; Cut Sheet</text>
  <text class="sub" x="42" y="67">Rev B · Craftsman 20 in ribbed steel box · 508 × 229 × 229 mm exterior · 488 × 208 mm deck · front bay split around the hasp</text>
  <rect class="pill-warn" x="1180" y="26" width="396" height="30" rx="15"/>
  <text class="ptw" x="1378" y="45.5" text-anchor="middle">PHOTO-AUDITED — MEASURE THE LID SPLIT</text>

  <!-- SIDE SECTION — true scale, 1.2 px/mm -->
  <text class="zone" x="30" y="104">1 · SIDE CROSS-SECTION · SCALE 1.2 px/mm · WIDTH AND HEIGHT TRUE</text>
  <rect class="panel" x="24" y="112" width="740" height="500"/>

