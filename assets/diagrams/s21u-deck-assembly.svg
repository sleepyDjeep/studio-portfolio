  <rect class="mod" x="854" y="208" width="58" height="26"/>
  <text class="m" x="858" y="225">OLED</text>
  <rect class="mod" x="920" y="208" width="76" height="26"/>
  <text class="m" x="924" y="225">4× switch</text>
  <rect class="mod" x="1004" y="208" width="70" height="26"/>
  <text class="m" x="1008" y="225">PWR/VOL</text>
  <rect class="mod-accent" x="1082" y="208" width="70" height="26"/>
  <text class="m" x="1086" y="225">USB-C</text>
  <text class="m" x="1160" y="225">rear strip 24 mm</text>

  <!-- keyboard 285 x 95 -->
  <rect class="mod" x="854" y="246" width="328" height="109"/>
  <text class="t" x="864" y="268">60 % keyboard · 285 × 95 × 18 mm</text>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="864" y1="282" x2="1172" y2="282"/>
    <line x1="864" y1="298" x2="1172" y2="298"/>
    <line x1="864" y1="314" x2="1172" y2="314"/>
    <line x1="864" y1="330" x2="1172" y2="330"/>
  </g>

  <!-- trackpad -->
  <rect class="mod" x="1194" y="246" width="98" height="63"/>
  <text class="m" x="1202" y="270">trackpad</text>
  <text class="m" x="1202" y="288">85 × 55</text>

  <!-- throttle cam -->
  <rect class="mod-warn" x="1194" y="318" width="92" height="37"/>
  <text class="m" x="1202" y="340">throttle cam</text>

  <!-- front row: well / plate / hasp / plate / well -->
  <rect class="mod-accent" x="854" y="372" width="97" height="46"/>
  <text class="m" x="860" y="392">LEFT WELL</text>
  <text class="m" x="860" y="408">84 × 40 × 34</text>

  <rect class="mod" x="957" y="372" width="115" height="46"/>
  <text class="m" x="962" y="388">PATCH A · 100 × 50</text>
  <text class="sm" x="962" y="405">RJ45·HDMI·KVM USB</text>

  <rect class="hasp" x="1078" y="372" width="53" height="46"/>
  <text class="sm" x="1104" y="393" text-anchor="middle">HASP</text>
  <text class="m" x="1104" y="408" text-anchor="middle">+ badge</text>

  <rect class="mod" x="1137" y="372" width="115" height="46"/>
  <text class="m" x="1142" y="388">PATCH B · 100 × 50</text>
  <text class="sm" x="1142" y="405">GX12·PHX8·TRRS</text>

  <rect class="mod-accent" x="1258" y="372" width="97" height="46"/>
  <text class="m" x="1264" y="392">RIGHT WELL</text>
