  <!-- antenna -->
  <circle cx="846" cy="316" r="7" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text class="m" x="806" y="345">SMA</text>
  <text class="m" x="806" y="359">bulkhead</text>

  <!-- dims -->
  <line class="dim" x1="846" y1="458" x2="1407" y2="458"/>
  <line class="dim" x1="846" y1="448" x2="846" y2="468"/>
  <line class="dim" x1="1407" y1="448" x2="1407" y2="468"/>
  <text class="dimt" x="1126" y="452" text-anchor="middle">488 mm</text>

  <line class="dim" x1="1430" y1="200" x2="1430" y2="439"/>
  <line class="dim" x1="1420" y1="200" x2="1440" y2="200"/>
  <line class="dim" x1="1420" y1="439" x2="1440" y2="439"/>
  <text class="dimt" x="1434" y="320" transform="rotate(-90 1434 320)" text-anchor="middle">208 mm</text>

  <text class="m" x="846" y="488">keyboard + trackpad = 378 mm of 476 mm usable width</text>
  <text class="m" x="846" y="504">front row = 438 mm of 476 mm · hasp, badge and both latches stay clear</text>
  <text class="m" x="846" y="520">lid closes over a 145 mm screen with 6 mm clearance</text>

  <!-- CUT LIST -->
  <text class="zone" x="30" y="646">3 · CUT &amp; PRINT LIST</text>
  <rect class="panel" x="24" y="654" width="740" height="216"/>
  <text class="m" x="40" y="678">PART                       MATERIAL                 SIZE (mm)                QTY</text>
  <line class="divider" x1="40" y1="686" x2="748" y2="686"/>
  <text class="b" x="40" y="706">Deck plate</text>
  <text class="m" x="214" y="706">3 mm steel or acrylic</text>
  <text class="m" x="430" y="706">488 × 208 · R6</text>
  <text class="m" x="700" y="706">1</text>
  <text class="b" x="40" y="730">Lid bezel</text>
  <text class="m" x="214" y="730">3 mm acrylic</text>
  <text class="m" x="430" y="730">234 × 148 · 224 × 138 view</text>
  <text class="m" x="700" y="730">1</text>
  <text class="b" x="40" y="754">Lid subframe</text>
  <text class="m" x="214" y="754">2 mm aluminium</text>
  <text class="m" x="430" y="754">240 × 154 · rivets to lid</text>
  <text class="m" x="700" y="754">1</text>
  <text class="b" x="40" y="778">Patch plates A / B</text>
  <text class="m" x="214" y="778">2 mm aluminium</text>
  <text class="m" x="430" y="778">100 × 50 · 3 holes each</text>
  <text class="m" x="700" y="778">2</text>
  <text class="b" x="40" y="802">Plate backers</text>
  <text class="m" x="214" y="802">1.5 mm aluminium</text>
  <text class="m" x="430" y="802">100 × 50 · inside the ribs</text>
  <text class="m" x="700" y="802">2</text>
  <text class="b" x="40" y="826">Stick wells</text>
  <text class="m" x="214" y="826">ABS / ASA print</text>
  <text class="m" x="430" y="826">84 × 40 × 34</text>
  <text class="m" x="700" y="826">2</text>
  <text class="b" x="40" y="850">Louvre + gasket</text>
  <text class="m" x="214" y="850">95A TPU · 1.5 neoprene</text>
  <text class="m" x="430" y="850">42 × 14 · 496 × 217 rim</text>
  <text class="m" x="700" y="850">1 + 1</text>

  <!-- STEPS -->
  <text class="zone" x="800" y="646">4 · ASSEMBLY SEQUENCE</text>
  <rect class="panel" x="794" y="654" width="782" height="216"/>
  <text class="b" x="810" y="676">1  Software lock-in on the S21U over external HDMI (Auto Blocker, ADB, DeX auto-start, 80 % cap)</text>
  <text class="b" x="810" y="700">2  Spot-weld 4S1P pack, fit the 10 A fuse in the pack-positive holder, verify 14.8–16.8 V</text>
  <text class="b" x="810" y="724">3  Cut the two VBUS links; confirm OL between RP2040 #2 VBUS and deck +5 V</text>
  <text class="b" x="810" y="748">4  Bench-run S21U + LCD + PPS hub; confirm DeX video/touch and Pause USB PD</text>
  <text class="b" x="810" y="772">5  Rivet the twin patch plates, their backers and four deck standoffs on the flat bands; star-ground</text>
  <text class="b" x="810" y="796">6  Build HOSAS sticks, wire to donor pad, calibrate endpoints and the throttle cam</text>
  <text class="b" x="810" y="820">7  Rivet the lid subframe, fit gasket and stay strap, mount panel, latch shut with sticks stowed</text>
  <text class="m" x="810" y="848">rivnuts for M3 · no holes through the tub floor except the louvre · lid hinge needs a stop</text>

  <!-- PHOTO AUDIT -->
  <text class="zone" x="30" y="906">5 · WHAT THE PHOTO CHANGED (ACTUAL UNIT, 2026-11-20)</text>
  <rect class="panel" x="24" y="914" width="1552" height="142"/>
  <text class="b" x="40" y="940">Ribbed walls: rivnuts and bulkheads only on the flat bands under the rim; a backer plate inside every exterior plate.</text>
  <text class="b" x="40" y="962">Twin draw latches + centre hasp + red badge: the front bay splits into two 100 × 50 plates flanking the hasp.</text>
  <text class="b" x="40" y="984">Riveted piano hinge: 10 mm relief at the deck's rear corners; the lid still has no detent, so keep the stay strap.</text>
  <text class="b" x="40" y="1006">Raised floor pan with a centre seam and rust: subfloor plate, rust converter and etch primer before bonding.</text>
  <text class="b" x="40" y="1028">Flaking lid paint: the panel bolts to a riveted 2 mm aluminium subframe, never to the paint.</text>
  <text class="b" x="812" y="940">Lift-out tray on stamped ledges: the ledges stand ~7 mm proud at mid-height, so the stack clears 203 mm, not 217.</text>
  <text class="b" x="812" y="962">Lid/tub split is still the unknown: the screen needs 45 mm and the under-deck stack 110 mm, so 60/157 and 85/132 both fit.</text>
  <text class="b" x="812" y="984">Bar the hinge and the deck sits on the rim, so the split changes the tub depth, not the plate size.</text>
  <text class="b" x="812" y="1006">The latches clamp on hooks in the lid lip: the lid gasket must sit inside them, not under them.</text>
  <text class="b" x="812" y="1028">Nothing in the photo fixes wall thickness; the 6 mm/side allowance stays an estimate until it is measured.</text>
</svg>
