<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="S21U Cyberdeck Mk1 hardware block diagram connecting broken-OLED Galaxy S21 Ultra Snapdragon 888 DeX core, 4S1P 51.8 Wh 100W PD pack, and dual Hall HOSAS sticks through USB hub to ESP32-S3 RF node, 3 RP2040 microcontrollers, and CANable 2.0.">
  <defs>
